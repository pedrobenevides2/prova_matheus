<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado Geral – Matheus pH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:white;border-radius:20px;padding:30px;max-width:680px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{text-align:center;color:#4a4a8a;font-size:1.6em;margin-bottom:10px}
.prog-text{text-align:center;color:#888;margin-bottom:6px;font-size:.95em}
.prog-bar{background:#eee;border-radius:10px;height:12px;margin-bottom:25px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#667eea,#764ba2);height:100%;border-radius:10px;transition:width .3s}
.question{font-size:1.25em;color:#333;line-height:1.5;margin-bottom:22px;padding:18px 20px;background:#f8f9ff;border-radius:12px;border-left:5px solid #667eea}
.opts{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.opt{display:flex;align-items:center;padding:14px 18px;border:3px solid #e0e0e0;border-radius:12px;cursor:pointer;background:white;font-size:1.05em;text-align:left;transition:all .2s;color:#333;width:100%}
.opt:hover{border-color:#667eea;background:#f0f0ff}
.opt.sel{border-color:#667eea;background:#e8e8ff;font-weight:bold}
.letter{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1em;margin-right:14px;flex-shrink:0}
.opt:nth-child(1) .letter{background:#4169E1;color:white}
.opt:nth-child(2) .letter{background:#32CD32;color:white}
.opt:nth-child(3) .letter{background:#FF8C00;color:white}
.opt:nth-child(4) .letter{background:#9932CC;color:white}
.next-btn{display:block;width:100%;padding:16px;background:linear-gradient(90deg,#667eea,#764ba2);color:white;font-size:1.1em;font-weight:bold;border:none;border-radius:12px;cursor:pointer;transition:opacity .2s}
.next-btn:disabled{opacity:.4;cursor:not-allowed}
.next-btn:not(:disabled):hover{opacity:.9}
.result{text-align:center;display:none}
.result h2{font-size:2em;color:#4a4a8a;margin-bottom:15px}
.score-circle{width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;color:white}
.score-num{font-size:3.5em;font-weight:bold;line-height:1}
.score-label{font-size:.85em;margin-top:4px}
.stars{font-size:2.8em;margin:15px 0}
.msg{font-size:1.15em;color:#555;margin-bottom:20px}
.restart-btn{display:inline-block;padding:14px 30px;background:linear-gradient(90deg,#667eea,#764ba2);color:white;font-size:1.1em;font-weight:bold;border:none;border-radius:12px;cursor:pointer}
.restart-btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="container">
<div id="quiz">
  <h1>🏫 Simulado Geral</h1>
  <div class="prog-text" id="prog-text"></div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="question" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <button class="next-btn" id="next-btn" onclick="next()" disabled>Próxima ▶</button>
</div>
<div class="result" id="result">
  <h2>🎉 Parabéns, Matheus!</h2>
  <div class="score-circle">
    <div class="score-num" id="score-num">0</div>
    <div class="score-label" id="score-label">de 25</div>
  </div>
  <div class="stars" id="stars"></div>
  <div class="msg" id="msg"></div>
  <button class="restart-btn" onclick="restart()">🔄 Tentar Novamente</button>
  <br><br>
  <a href="index.html" style="color:#667eea;font-size:1em">← Voltar ao menu</a>
</div>
</div>
<script>
const QS=[{"q": "Qual tipo de texto conta a história real de uma pessoa, com fatos que realmente aconteceram na sua vida?", "opts": ["Fábula", "Conto de fadas", "Poesia", "Biografia"], "correct": 3}, {"q": "No Material Dourado, se você pegar uma \"placa\" inteira, qual é o valor que ela representa?", "opts": ["1 unidade", "1 dezena", "1 milhar", "1 centena"], "correct": 3}, {"q": "Qual sinal de pontuação usamos no final de uma frase que faz uma pergunta?", "opts": ["Ponto de interrogação (?)", "Ponto de exclamação (!)", "Ponto final (.)", "Vírgula (,)"], "correct": 0}, {"q": "Quais elementos do ambiente NÃO têm vida?", "opts": ["Árvore, flor e capim", "Pedra, água e ar", "Borboleta, minhoca e besouro", "Cachorro, gato e peixe"], "correct": 1}, {"q": "Como se chama a forma de ver um objeto de cima para baixo, como um pássaro vê o chão?", "opts": ["Visão oblíqua", "Visão frontal", "Visão vertical", "Visão lateral"], "correct": 2}, {"q": "Na palavra PÁSSARO, por que usamos SS e não apenas um S?", "opts": ["Porque a palavra está no plural", "As letras S devem ficar em sílabas separadas", "Porque SS aparece entre vogais com som fraco", "Porque a palavra começa com consoante"], "correct": 1}, {"q": "Qual meio de comunicação permite conversar com alguém em tempo real, mesmo estando longe?", "opts": ["Carta", "Telefone", "Jornal", "Livro"], "correct": 1}, {"q": "Como podemos saber se um número é PAR, olhando apenas o seu último algarismo?", "opts": ["Se ele terminar em 0, 2, 4, 6 ou 8", "Se ele terminar em 1, 3, 5, 7 ou 9", "Se ele for maior que 10", "Se ele puder ser dividido por 3"], "correct": 0}, {"q": "Qual parte da planta é responsável por produzir o fruto e proteger as sementes?", "opts": ["Raiz", "Flor", "Caule", "Folha"], "correct": 1}, {"q": "Você foi à padaria com R$50,00. Gastou R$20,00. Quanto você tem de troco?", "opts": ["R$70,00", "R$20,00", "R$30,00", "R$10,00"], "correct": 2}, {"q": "Como chamamos os nomes de pessoas e lugares específicos, que sempre são escritos com letra maiúscula?", "opts": ["Substantivos comuns", "Substantivos próprios", "Adjetivos", "Verbos"], "correct": 1}, {"q": "Em inglês (English), which object in your bedroom do you use to sleep on?", "opts": ["Chair", "Desk", "Bed", "Lamp"], "correct": 2}, {"q": "Muito tempo atrás, com que material as crianças escreviam na escola?", "opts": ["Lápis e borracha", "Caneta de pena e tinteiro", "Caneta esferográfica", "Marcador de quadro branco"], "correct": 1}, {"q": "Qual é o diminutivo correto da palavra PEIXE?", "opts": ["Peixão", "Peixinho", "Peixe pequeno", "Peixoca"], "correct": 1}, {"q": "Qual animal usa asas para se deslocar de um lugar para outro?", "opts": ["Morcego", "Toupeira", "Cobra", "Tartaruga"], "correct": 0}, {"q": "Qual documento pessoal é feito logo que um bebê nasce e contém o nome dos pais e o local do nascimento?", "opts": ["Carteira de Motorista", "Certidão de Nascimento", "Título de Eleitor", "Passaporte"], "correct": 1}, {"q": "Em inglês (English), which expression can we use to invite a friend to play?", "opts": ["Let's play!", "Thank you.", "Good morning.", "I am play."], "correct": 0}, {"q": "Ao escrever a palavra 'AÇÚCAR', por que usamos a letra 'Ç' em vez de apenas 'C'?", "opts": ["Para que a letra tenha o som de 'S' antes da vogal 'U'.", "Porque a palavra está no plural.", "Porque é um nome próprio.", "Para indicar que a sílaba é tônica."], "correct": 0}, {"q": "Na matemática, se você tem 7 dezenas e 4 unidades, qual número você formou?", "opts": ["11", "704", "74", "47"], "correct": 2}, {"q": "Qual destes meios de transporte é considerado mais amigável ao meio ambiente por não emitir fumaça poluidora?", "opts": ["Bicicleta", "Carro particular", "Ônibus a diesel", "Avião"], "correct": 0}, {"q": "Complete a frase com o artigo correto: '___ CORUJA gosta de caçar à noite.'", "opts": ["O", "A", "Um", "Uns"], "correct": 1}, {"q": "Por que é importante preservar objetos antigos da nossa família?", "opts": ["Porque eles ajudam a contar a história do nosso passado.", "Porque eles são mais bonitos que os novos.", "Porque eles valem muito dinheiro.", "Apenas para ocupar espaço em museus."], "correct": 0}, {"q": "Qual é o som da letra 'G' na palavra 'GELO'?", "opts": ["Som de 'J'", "Som de 'G' de Gato", "Som de 'R'", "Som de 'S'"], "correct": 0}, {"q": "Se um item custa R$15 e você paga com uma nota de R$10 e uma de R$5, você terá troco?", "opts": ["Não, o valor é exato.", "Sim, sobrará R$5.", "Não, ainda faltará dinheiro.", "Sim, sobrará R$10."], "correct": 0}, {"q": "Qual destas palavras está escrita de forma correta, seguindo a regra do som 'LH'?", "opts": ["UTENSÍLHO", "CHOCALHO", "MOBILHA", "FAMÍLIA"], "correct": 1}];
let cur=0,sel=-1,score=0;
function load(){
  const q=QS[cur];
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('prog-text').textContent='Pergunta '+(cur+1)+' de '+QS.length;
  document.getElementById('prog-fill').style.width=(((cur+1)/QS.length)*100)+'%';
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  ['A','B','C','D'].forEach(function(l,i){
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="letter">'+l+'</span>'+q.opts[i];
    b.onclick=function(){pick(i);};
    opts.appendChild(b);
  });
  sel=-1;
  document.getElementById('next-btn').disabled=true;
}
function pick(i){
  sel=i;
  document.querySelectorAll('.opt').forEach(function(b,idx){
    b.classList.toggle('sel',idx===i);
  });
  document.getElementById('next-btn').disabled=false;
}
function next(){
  if(sel===QS[cur].correct) score++;
  cur++;
  if(cur<QS.length){load();}
  else{showResult();}
}
function showResult(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('score-num').textContent=score;
  const pct=score/QS.length;
  let stars='',msg='';
  if(pct>=.9){stars='⭐⭐⭐⭐⭐';msg='🏆 Incrível! Você arrasou de verdade!';}
  else if(pct>=.7){stars='⭐⭐⭐⭐';msg='👏 Muito bem! Quase perfeito!';}
  else if(pct>=.5){stars='⭐⭐⭐';msg='💪 Bom esforço! Continue praticando!';}
  else if(pct>=.3){stars='⭐⭐';msg='📚 Vamos revisar e tentar de novo?';}
  else{stars='⭐';msg='😊 Não desista! Estude e tente novamente!';}
  document.getElementById('stars').textContent=stars;
  document.getElementById('msg').textContent=msg;
}
function restart(){
  cur=0;sel=-1;score=0;
  document.getElementById('quiz').style.display='block';
  document.getElementById('result').style.display='none';
  load();
}
load();
</script>
</body>
</html>
